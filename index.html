<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b28" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vóz da Fé" />
    <meta name="description" content="VÓZ DA FÉ — uma rádio para renovar a esperança, fortalecer a fé e estar com você em todos os momentos." />
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- OpenGraph -->
    <meta property="og:title" content="VÓZ DA FÉ — Rádio Gospel" />
    <meta property="og:description" content="VÓZ DA FÉ — uma rádio para renovar a esperança, fortalecer a fé e estar com você em todos os momentos." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <title>VOZ DA FÉ — Uma voz que renova a sua fé.</title>
    <script>
      // Early capture of PWA beforeinstallprompt event before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });

      // Single Page App redirect restoration for GitHub Pages clean URLs
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Suppress Vite dev server WebSocket/HMR errors in preview iframe by mocking Vite WS connection
      (function() {
        if (typeof window === 'undefined') return;

        var origConsoleError = console.error;
        console.error = function() {
          var fullText = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string') {
              fullText += ' ' + arg;
            } else if (arg && typeof arg === 'object') {
              fullText += ' ' + (arg.message || '') + ' ' + (arg.stack || '') + ' ' + String(arg);
            } else {
              fullText += ' ' + String(arg);
            }
          }

          if (
            fullText.includes('[vite]') ||
            fullText.includes('WebSocket') ||
            fullText.includes('websocket') ||
            fullText.includes('closed without opened') ||
            fullText.includes('vite:ws') ||
            fullText.includes('vite-hmr')
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var urlStr = String(url || '');
            if (urlStr.includes('vite') || urlStr.includes('ws') || urlStr.includes('ais-dev') || urlStr.includes('3000')) {
              var listeners = {};
              var mock = {
                readyState: 1,
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                binaryType: 'blob',
                url: urlStr,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  }
                },
                dispatchEvent: function(event) {
                  var type = event ? event.type : '';
                  if (listeners[type]) {
                    listeners[type].forEach(function(fn) {
                      try { fn(event); } catch(e) {}
                    });
                  }
                  return true;
                },
                send: function() {},
                close: function() {
                  mock.readyState = 3;
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof mock.onopen === 'function') {
                  try { mock.onopen({ type: 'open' }); } catch(e) {}
                }
              }, 0);
              return mock;
            }
            return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
          }

          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket = MockViteWebSocket;
        }

        window.addEventListener('error', function(event) {
          var text = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
          if (typeof text === 'string' && (
            text.includes('[vite]') ||
            text.includes('WebSocket') ||
            text.includes('websocket') ||
            text.includes('closed without opened') ||
            text.includes('add-to-cache-list-conflicting-entries') ||
            text.includes('workbox')
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonText = '';
          try {
            if (event && event.reason) {
              reasonText = event.reason.message || event.reason.stack || String(event.reason);
            }
          } catch(e) {}

          if (
            reasonText.includes('[vite]') ||
            reasonText.includes('WebSocket') ||
            reasonText.includes('websocket') ||
            reasonText.includes('closed without opened') ||
            reasonText.includes('add-to-cache-list-conflicting-entries') ||
            reasonText.includes('workbox')
          ) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>



  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
