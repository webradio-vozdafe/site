<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102b28" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vóz da Fé" />
    <meta name="description" content="VÓZ DA FÉ — uma rádio para renovar a esperança, fortalecer a fé e estar com você em todos os momentos." />
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- OpenGraph -->
    <meta property="og:title" content="VÓZ DA FÉ — Rádio Gospel" />
    <meta property="og:description" content="VÓZ DA FÉ — uma rádio para renovar a esperança, fortalecer a fé e estar com você em todos os momentos." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <title>VOZ DA FÉ — Uma voz que renova a sua fé.</title>
    <script>
      // Early capture of PWA beforeinstallprompt event before React mounts
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });

      // Single Page App redirect restoration for GitHub Pages clean URLs
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Suppress benign Vite dev server WebSocket/HMR errors in iframe preview
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var fullText = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (typeof arg === 'string') {
              fullText += ' ' + arg;
            } else if (arg && typeof arg === 'object') {
              fullText += ' ' + (arg.message || '') + ' ' + (arg.stack || '') + ' ' + String(arg);
            } else {
              fullText += ' ' + String(arg);
            }
          }

          if (
            fullText.includes('WebSocket') ||
            fullText.includes('websocket') ||
            fullText.includes('closed without opened') ||
            fullText.includes('vite:ws') ||
            fullText.includes('vite-hmr')
          ) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          function PatchedWebSocket(url, protocols) {
            var ws = protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            ws.addEventListener('error', function(err) {
              if (err && err.stopImmediatePropagation) {
                err.stopImmediatePropagation();
              }
            });
            return ws;
          }

          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        }

        window.addEventListener('error', function(event) {
          var text = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
          if (typeof text === 'string' && (
            text.includes('WebSocket') ||
            text.includes('websocket') ||
            text.includes('closed without opened') ||
            text.includes('vite')
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonText = '';
          try {
            if (event && event.reason) {
              reasonText = event.reason.message || event.reason.stack || String(event.reason);
            }
          } catch(e) {}

          if (
            reasonText.includes('WebSocket') ||
            reasonText.includes('websocket') ||
            reasonText.includes('closed without opened') ||
            reasonText.includes('vite')
          ) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>



  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
